<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking System - {{ title }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <a class="nav-brand nav-link" href="/">
            <div class="brand-icon small">B</div>
            <span>Banking System</span>
        </a>
        <a href="/logout" class="logout-btn">Logout</a>
    </nav>

    <main class="form-page">
        <section class="page-form-card transaction-card">
            <a href="/" class="back-link">&larr; Back to dashboard</a>
            <h1>{{ title }}</h1>
            <p class="form-intro">{{ description }}</p>

            {% if error %}
                <div class="alert error">{{ error }}</div>
            {% endif %}

            <form action="{{ action }}" method="POST">
                <div class="form-group">
                    <label for="holder">Account Holder</label>
                    <input id="holder" type="text" name="holder" placeholder="Enter exact account holder name" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input id="amount" type="number" name="amount" min="0.01" step="0.01" placeholder="0.00" required>
                </div>
                <div class="modal-actions">
                    <a href="/" class="btn secondary">Cancel</a>
                    <button type="submit" class="btn primary">{{ button }}</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
